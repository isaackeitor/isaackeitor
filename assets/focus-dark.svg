  <text x="28" y="104" class="tile-title" fill="#f5f5f7">Arquitectura escalable</text>
  <text x="28" y="134" class="tile-body" fill="#a1a1a6">Sistemas modulares y APIs diseñadas para</text>
  <text x="28" y="157" class="tile-body" fill="#a1a1a6">crecer sin perder mantenibilidad.</text>
</g>
<g transform="translate(0 300)">
  <rect x="0.5" y="0.5" width="413" height="183" rx="22" fill="rgba(255,255,255,0.045)" stroke="rgba(255,255,255,0.08)"/>
  <g transform="translate(26 26) scale(1.25)" fill="none" stroke="#ff9f0a" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2.5"/><path d="M8.5 7V5.5a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2V7"/><path d="M3 12.5h18"/></g>
