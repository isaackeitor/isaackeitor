  <g transform="translate(26 26) scale(1.25)" fill="none" stroke="#30d158" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2.5 4.5 13.5H12l-1 8 8.5-11H12z"/></g>
