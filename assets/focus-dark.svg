  <text x="28" y="104" class="tile-title" fill="#f5f5f7">Full-stack</text>
  <text x="28" y="134" class="tile-body" fill="#a1a1a6">De la base de datos a la interfaz, con</text>
  <text x="28" y="157" class="tile-body" fill="#a1a1a6">TypeScript, React, Next.js y Node.js.</text>
</g>
<g transform="translate(426 104)">
