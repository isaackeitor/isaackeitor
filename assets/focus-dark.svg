<svg xmlns="http://www.w3.org/2000/svg" width="840" height="488" viewBox="0 0 840 488" role="img" aria-label="Enfoque. Lo que construyo. Full-stack, Arquitectura escalable, Sistemas empresariales, Alto rendimiento.">
<title>Enfoque. Lo que construyo. Full-stack, Arquitectura escalable, Sistemas empresariales, Alto rendimiento.</title>
<style>
