.tile-body { font: 400 15px -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; letter-spacing: -0.005em; }
</style>
<text x="0" y="72" class="headline"><tspan fill="#f5f5f7">Enfoque. </tspan><tspan fill="#a1a1a6">Lo que construyo.</tspan></text>
